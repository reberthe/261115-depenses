<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dépenses">
<meta name="theme-color" content="#F2F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Dépenses</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<p id="chargement" class="chargement">Chargement…</p>

<!-- Connexion -->
<section id="ecran-connexion" class="ecran-connexion" hidden>
  <form id="form-connexion" class="carte connexion">
    <h1>Dépenses</h1>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="motdepasse">Mot de passe</label>
    <input id="motdepasse" type="password" autocomplete="current-password" required>
    <button type="submit" class="bouton-principal">Se connecter</button>
    <p id="erreur-connexion" class="erreur" role="alert"></p>
  </form>
</section>

<!-- Appli -->
<div id="appli" hidden>
  <main id="contenu"></main>
  <nav class="onglets" aria-label="Onglets">
    <button type="button" data-onglet="avoirs">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Avoirs</button>
    <button type="button" data-onglet="rentrees">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Rentrées</button>
    <button type="button" data-onglet="depenses">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>Dépenses</button>
    <button type="button" data-onglet="fixes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Fixes</button>
    <button type="button" data-onglet="compteurs">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 13l3-3"/></svg>Compteurs</button>
  </nav>
</div>

<!-- Feuille (fenêtre par-dessus l'écran) et message -->
<div id="feuille" class="feuille-fond" hidden>
  <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="feuille-titre">
    <div class="feuille-haut">
      <button type="button" id="feuille-fermer" class="bouton-texte">Fermer</button>
      <h2 id="feuille-titre"></h2>
      <span class="feuille-place"></span>
    </div>
    <div id="feuille-corps" class="feuille-corps"></div>
  </div>
</div>
<p id="message" class="message" role="status" hidden></p>

<script src="config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
        integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O"
        crossorigin="anonymous"></script>
<script src="js/commun.js?v=1"></script>
<script src="js/fixes.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
